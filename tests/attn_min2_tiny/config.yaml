# The attention min-of-2 network (models/attn-min2/model.py and task.py, copied) at the size of
# tests/attn_max2_tiny: 8 tokens, width 4, head size 4 (the attention scale 1/sqrt(4) is exactly 1/2),
# 64 inputs. Trained by core.train; a tiny attention model for open-lane pilots.
size_settings:
  v8d4:
    n_ctx: 2
    d_vocab: 8
    d_model: 4
    d_head: 4
seeds: [0, 1]
split:
  held_out_per_setting: 1
  seed: 7
training:
  optimizer: AdamW
  lr: 0.001
  weight_decay: 0.01
  batch_size: 512
  steps: 4000
zoo_path: zoo
cost_model: cost-v3
control_networks: []
hygiene: []
# The Lean checker for the legacy lane's proof files (core.lean: a spot check of frontier entries during a run,
# with lean_spot_check: true; scripts/check_run.py of the Lean project checks every proof afterwards). The Lean
# project is COMPACT_PROOF_LEAN or the pilots' default path, built with `lake build compactcheck`.
lean_check: [python3, ../../scripts/lean_check_proof.py, "{proof}", "{weights}"]
