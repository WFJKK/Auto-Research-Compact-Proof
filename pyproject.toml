[project]
name = "auto-research-compact-proof"
version = "0.1.0"
description = "An agentic loop that hill-climbs towards better compact proofs for small trained models."
requires-python = ">=3.10"
dependencies = ["torch", "numpy", "pyyaml", "psutil", "anthropic", "matplotlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
