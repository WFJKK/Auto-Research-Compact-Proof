# The open-lane pilot on the tiny linear max-of-4 network (tests/max4_tiny: the max2 model's architecture,
# 4 positions, 4 tokens, hidden width 4, 256 inputs; the output is the largest token), next to the attention
# pilot on the same task and size (open-lane-pilot-attn-max4-tiny.yaml). Prompt template v2 with the linear
# scored example, metric Q_exact, minimal knowledge, up to 7 rounds. Edit open_lane.lean_project to where the
# Lean project is on this machine, and build it there first:
# lake build CompactCheck.Soundness CompactCheck.CountedOps CompactCheck.CountedGeneralSound compactcheck acceptcheck
run_id: open-lane-pilot-max4-tiny
model: tests/max4_tiny
backend: claude_code
agent_model: claude-fable-5-1
effort: xhigh
prompt_template: open_lane_v2
# The legacy lane (round 0's baselines) limited to single and skip; explicit, as the ticket asks.
rule_set: [single, skip]
# The score the agent is shown and asked to raise: the verified frontier's log-area above the brute-force line,
# over the room above it (docs/decisions/q-above.md). Brute force on any subset of the inputs scores 0.
metric: Q_above
baselines: [brute_force]
rounds_max: 7
patience: 4
api_retries: {tries: 12, first_wait_s: 60, max_wait_s: 1800, timeout_s: 3600}
sandbox: auto   # hardened once Docker or Landlock is available; the receipts record the isolation
open_lane:
  enabled: true
  lean_project: ~/Desktop/VerifiedMechanisms/LeanFormalisations/CompactCheck
  example: examples/open_lane/max2_tiny_scored/Candidate/Max2TinyScored.lean
  extra_sources: []
  knowledge: minimal
  compile_calls: 40
  python_calls: 30
  submissions: 3
  max_turns: 150
  worker_seconds: 10800     # as the attention pilot on the same task and size
  stall_rounds: 2
