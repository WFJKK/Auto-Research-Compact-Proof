# Source: https://platform.claude.com/docs/en/about-claude/pricing, read on 2026-10-09.
# Check the page again before a long run; prices change.
claude-fable-5-1:
  input: 10.0
  output: 50.0
  cache_write_5m: 12.5
  cache_write_1h: 20.0
  cache_read: 0.25
