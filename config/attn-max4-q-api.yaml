# max-of-4 on Gross et al.'s one-head transformer through the Messages API, the
# agent scored on Q. Five rounds, same model and effort as max2-rerun-q. The key
# comes from the variable api_key_env names (never ANTHROPIC_API_KEY). Run
# config/attn-max4-smoke.yaml first.
run_id: attn-max4-q-api
model: models/attn-max4
backend: api
agent_model: claude-fable-5-1
effort: high
metric: Q
rounds_max: 5
patience: 5
baselines: [brute_force]
sandbox: hardened
