# Smoke test for max-of-2 on Gross et al.'s one-head transformer through the
# Messages API: plumbing only, on the cheapest model, before a real run. Two
# rounds on one network per size setting. Costs a few cents.
run_id: attn-max2-smoke
model: models/attn-max2
backend: api
agent_model: claude-haiku-5-5
effort: medium
metric: Q
rounds_max: 2
networks: [attn-max2-v64-s0, attn-max2-v128-s0]
baselines: [brute_force]
sandbox: hardened
