# min-of-2 on Gross et al.'s one-head transformer (models/attn-min2), through your
# Claude Code login, scored at fixed budgets (Q_grid). Brute force is the only
# baseline. For the API instead: backend: api, with the key in the variable
# named by api_key_env (see README, "Running with your own API key").
run_id: attn-min2-grid
model: models/attn-min2
backend: claude_code
agent_model: claude-fable-5-1
effort: high
metric: Q_grid
budget_ratio: 2
rounds_max: 10
patience: 10
api_retries: {tries: 12, first_wait_s: 60, max_wait_s: 1800, timeout_s: 3600}
baselines: [brute_force]
sandbox: hardened
# Softmax networks: the checker refuses contract, symmetry and approximate
# (they need a network of linear maps). token_interval keeps each token's rows
# exact through the attention (see docs/RULES.md).
rule_set: [single, interval, token_interval, skip]
