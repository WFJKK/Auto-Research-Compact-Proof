# max-of-4 on Gross et al.'s one-head transformer through the Messages API,
# scored at fixed budgets. The key comes from the variable api_key_env names
# (never ANTHROPIC_API_KEY); costs are priced from config/prices.yaml. Run a
# smoke config (rounds_max 2, a small model) before a long run.
run_id: attn-max4-grid-api
model: models/attn-max4
backend: api
agent_model: claude-fable-5-1
effort: high
thinking: {type: adaptive}
max_output_tokens: 64000
metric: Q_grid
budget_ratio: 2
rounds_max: 10
patience: 10
baselines: [brute_force]
sandbox: hardened
# Softmax networks: the checker refuses contract, symmetry and approximate
# (they need a network of linear maps). token_interval keeps each token's rows
# exact through the attention (see docs/RULES.md).
rule_set: [single, interval, token_interval, skip]
# Recipes on the 4-token model can build large tables; 2048 MB was too little
# for one max-of-4 recipe on 16 October.
memory_limit_mb: 4096
# The v16 and v24 development networks only: v64 (added 19 October) has its own
# configs, since brute force cannot run there.
networks: [attn-max4-v16-s1, attn-max4-v16-s2, attn-max4-v16-s5, attn-max4-v16-s6, attn-max4-v16-s8, attn-max4-v16-s9, attn-max4-v24-s0, attn-max4-v24-s2, attn-max4-v24-s3, attn-max4-v24-s5, attn-max4-v24-s7, attn-max4-v24-s8]
