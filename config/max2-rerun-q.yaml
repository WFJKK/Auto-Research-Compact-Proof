# Rerun of the max2 pilot under cost-v2, through the Claude Code login, with the
# agent scored on Q. Its twin config scores the other metric; both report both.
# Same model, effort and length as max2-fable-high, so the three runs compare.
run_id: max2-rerun-q
model: models/max2
backend: claude_code
agent_model: claude-fable-5-1
effort: high
metric: Q
rounds_max: 10
patience: 10
api_retries: {tries: 12, first_wait_s: 60, max_wait_s: 1800, timeout_s: 3600}
baselines: [brute_force]
sandbox: hardened
