# Defaults for every run config (section 7 of docs/SPEC.md).
#
# A run config names its run_id and model and may override any key below.
# The merged settings are copied into the run folder when the run starts, so
# later edits to this file never change an existing run.

seed: 0

# Which development networks a round uses: "all", or a list of network ids.
networks: all
knob_values: [0, 0.25, 0.5, 0.75, 1]

# Run data lives outside the repository.
runs_dir: ~/auto-research-compact-proof-runs

# Sandbox limits, per recipe execution (one network and one knob value).
time_limit_s: 300
memory_limit_mb: 2048
max_proof_mb: 32
threads_per_recipe: 1
# Recipe executions that run at the same time.
workers: 2
# Where sandbox folders are made; null means the system's temporary folder.
sandbox_dir: null

# Round 0 replays the model folder's baselines/ responses; agent rounds follow.
baselines: true
rounds_max: 100
patience: 25
recipes_per_round: 1
# Run each recipe on one development network per size setting first, and on
# the rest only if it certified something there.
screen: true

shown_top_recipes: 3
shown_last_attempts: 3

# fake, manual or api.
backend: fake
# Files or folders of responses the fake backend replays, in order.
fake_responses: []

agent_model: claude-fable-5-1
# Set in Step 8 from the current API documentation.
thinking: null
max_output_tokens: null
# The variable holding the API key. Never ANTHROPIC_API_KEY.
api_key_env: CPL_ANTHROPIC_KEY

prompt_template: v1
rule_set: [single, interval, skip, contract, symmetry, approximate]
# The number the agent sees as its score: Q or cost_of_finishing.
metric: Q
lean_spot_check: false
