# Defaults for every run config (section 7 of docs/SPEC.md).
#
# A run config names its run_id and model and may override any key below.
# The merged settings are copied into the run folder when the run starts, so
# later edits to this file never change an existing run.

seed: 0

# Which development networks a round uses: "all", or a list of network ids.
networks: all
knob_values: [0, 0.25, 0.5, 0.75, 1]

# Run data lives outside the repository.
runs_dir: ~/auto-research-compact-proof-runs

# How long the trusted checker may spend on one proof file before it rejects it
# and moves on (a backstop; honest proofs check in well under a second).
check_timeout_s: 600

# Sandbox limits, per recipe execution (one network and one knob value).
time_limit_s: 300
memory_limit_mb: 2048
max_proof_mb: 32
threads_per_recipe: 1
# Recipe executions that run at the same time.
workers: 2
# Where sandbox folders are made; null means the system's temporary folder.
sandbox_dir: null
# How recipes are kept in: auto (the strongest that works here), container,
# landlock or process (weak). See core/sandbox.py and docs/SANDBOX.md.
sandbox: auto
sandbox_image: auto-research-compact-proof-sandbox:1

# Round 0 replays baselines from the model folder's baselines/ folder: true for
# all of them, false for none, or a list of names (for example [brute_force],
# so the agent starts from brute force and has to discover everything else).
baselines: true
rounds_max: 100
patience: 25
recipes_per_round: 1
# Run each recipe on one development network per size setting first, and on
# the rest only if it certified something there.
screen: true

shown_top_recipes: 3
shown_last_attempts: 3
# The prompt's size budget, in tokens estimated as characters / 4. Over it, the
# builder leaves out recipe code, then cuts diagnostics, then notes.
prompt_budget_tokens: 40000

# fake, manual, api or claude_code. api bills an API key per token;
# claude_code runs the official Claude Code CLI headless under your own
# Claude subscription login instead (see docs/BACKENDS.md and Anthropic's
# current terms for Claude Code before relying on it).
backend: fake
# The Claude Code executable for the claude_code backend.
claude_code_command: claude
# Files or folders of responses the fake backend replays, in order.
fake_responses: []

agent_model: claude-fable-5-1
# Passed to the Messages API as `thinking`; adaptive lets the model decide how
# much to think, guided by effort (low, medium, high, xhigh or max), which goes
# into `output_config`. null leaves either out.
thinking: {type: adaptive}
effort: xhigh
# A hard cap on thinking plus answer; responses stream, so a large one is fine.
max_output_tokens: 64000
# The variable holding the API key. Never ANTHROPIC_API_KEY.
api_key_env: CPL_ANTHROPIC_KEY
# Retries for errors that pass by themselves (overloaded, server errors, rate
# limits with a retry-after, lost connections); waits double from first_wait_s.
# Spend limits, billing, authentication and malformed requests stop the run.
api_retries: {tries: 6, first_wait_s: 10, max_wait_s: 300, timeout_s: 1800}
# Stop when this many attempts in a row were refused by the model.
max_consecutive_refusals: 3

prompt_template: v1
rule_set: [single, interval, skip, contract, symmetry, approximate]
# The number the agent sees as its score: Q or cost_of_finishing.
metric: Q
lean_spot_check: false
