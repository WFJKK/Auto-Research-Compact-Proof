# max-of-2 on Gross et al.'s one-head transformer through the Messages API, the
# agent scored on Q, four rounds: attn-max2-q-api again, now with the
# token_interval rule the agent asked for in that run (docs/RULES.md). Run
# config/attn-max2-smoke.yaml first.
run_id: attn-max2-q-api-tokens
model: models/attn-max2
backend: api
agent_model: claude-fable-5-1
effort: high
metric: Q
rounds_max: 4
patience: 4
baselines: [brute_force]
sandbox: hardened
# Softmax networks: the checker refuses contract, symmetry and approximate
# (they need a network of linear maps). token_interval keeps each token's rows
# exact through the attention (see docs/RULES.md).
rule_set: [single, interval, token_interval, skip]
